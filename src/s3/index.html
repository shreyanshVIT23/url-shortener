<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>URL Shortener</title>
  <script src="config.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 4rem auto; padding: 0 1rem; }
    form { display: flex; gap: .5rem; }
    input { flex: 1; padding: .6rem; font-size: 1rem; }
    button { padding: .6rem 1rem; font-size: 1rem; cursor: pointer; }
    #result { margin-top: 1.5rem; word-break: break-all; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>URL Shortener</h1>
  <form id="form">
    <input id="url" type="url" placeholder="https://example.com/very/long/link" required>
    <button type="submit">Shorten</button>
  </form>
  <div id="result"></div>

  <script>
    const form = document.getElementById("form");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      result.textContent = "Shortening...";
      result.className = "";
      try {
        const resp = await fetch(`${window.API_URL}/shorten`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: document.getElementById("url").value }),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
        result.innerHTML = "";
        const link = document.createElement("a");
        link.href = data.short_url;
        link.textContent = data.short_url;
        link.target = "_blank";
        result.append("Short link: ", link);
      } catch (err) {
        result.textContent = `Error: ${err.message}`;
        result.className = "error";
      }
    });
  </script>
</body>
</html>
